<script>
  (function() {
    // Save Toggle Interaction
    const saveBtn = document.getElementById('saveActionBtn');
    const saveIcon = document.getElementById('saveIcon');
    const saveLabel = document.getElementById('saveLabel');
    let isSaved = false;

    if (saveBtn && saveIcon && saveLabel) {
      saveBtn.addEventListener('click', () => {
        isSaved = !isSaved;
        if (isSaved) {
          saveIcon.style.fontVariationSettings = "'FILL' 1";
          saveIcon.classList.remove('text-on-surface-variant');
          saveIcon.classList.add('text-primary-container');
          saveLabel.textContent = 'Saved';
          saveLabel.classList.add('text-primary-container');
          saveBtn.classList.add('bg-surface-container-high');
        } else {
          saveIcon.style.fontVariationSettings = "'FILL' 0";
          saveIcon.classList.remove('text-primary-container');
          saveIcon.classList.add('text-on-surface-variant');
          saveLabel.textContent = 'Save Clip';
          saveLabel.classList.remove('text-primary-container');
          saveBtn.classList.remove('bg-surface-container-high');
        }
      });
    }

    // Play/Pause Micro-interaction
    const videoContainer = document.getElementById('videoContainer');
    const playCenterPill = document.getElementById('playCenterPill');
    const playIcon = playCenterPill ? playCenterPill.querySelector('.material-symbols-outlined') : null;
    let isPlaying = false;

    if (videoContainer && playCenterPill && playIcon) {
      videoContainer.addEventListener('click', () => {
        isPlaying = !isPlaying;
        if (isPlaying) {
          playIcon.textContent = 'pause';
          playCenterPill.classList.add('opacity-0', 'scale-90');
        } else {
          playIcon.textContent = 'play_arrow';
          playCenterPill.classList.remove('opacity-0', 'scale-90');
        }
      });
    }

    // Playback Speed Toggle Micro-interaction
    const speedToggle = document.getElementById('speedToggle');
    const speeds = ['1.0×', '0.8×', '1.2×'];
    let speedIndex = 0;
    if (speedToggle) {
      speedToggle.addEventListener('click', (e) => {
        e.stopPropagation();
        speedIndex = (speedIndex + 1) % speeds.length;
        speedToggle.textContent = speeds[speedIndex];
      });
    }

    // Pronunciation sound cue simulation
    const pronounceBtn = document.getElementById('pronounceAudioBtn');
    if (pronounceBtn) {
      pronounceBtn.addEventListener('click', () => {
        pronounceBtn.classList.add('text-primary-container');
        setTimeout(() => {
          pronounceBtn.classList.remove('text-primary-container');
        }, 600);
      });
    }

    // Keyword Tooltip Toggle
    const keywordBtn = document.getElementById('keywordTooltipBtn');
    const defBox = document.getElementById('definitionBox');
    if (keywordBtn && defBox) {
      keywordBtn.addEventListener('click', () => {
        defBox.classList.toggle('hidden');
      });
    }

    // Share Feedback
    const shareBtn = document.getElementById('shareActionBtn');
    if (shareBtn) {
      shareBtn.addEventListener('click', () => {
        if (navigator.share) {
          navigator.share({
            title: 'Stop saying "very good" — Natural Alternatives',
            text: 'Discover natural British English vocabulary on Cliplish.',
            url: window.location.href,
          }).catch(() => {});
        } else {
          const shareText = shareBtn.querySelector('span:last-child');
          const original = shareText.textContent;
          shareText.textContent = 'Link Copied';
          setTimeout(() => {
            shareText.textContent = original;
          }, 1500);
        }
      });
    }
  })();
